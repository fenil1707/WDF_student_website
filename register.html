<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration | StudentHub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <div class="logo">🎓</div>
        <div>
          <h2>StudentHub</h2>
          <p>Student Portal</p>
        </div>
      </div>

      <nav class="site-nav">
        <a href="home.html">Home</a>
        <a href="timetable.html">Timetable</a>
        <a href="results.html">Results</a>
        <a href="courses.html">Courses</a>
        <a href="register.html" class="active">Register</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="container">
      <div class="card registration-card">
        <h1>Student Registration</h1>
        <p>Enter your details to complete the registration form.</p>

        <!-- CHANGED: Added action and method -->
        <form
          id="registrationForm"
          action="register.php"
          method="POST"
          novalidate
        >
          <!-- CHANGED: Added hidden field for PHP to know which form was submitted -->
          <input type="hidden" name="form_type" value="registration" />

          <div class="form-group">
            <label for="name">Full Name</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your full name"
              required
            />
            <small class="error" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="student@example.com"
              required
            />
            <small class="error" id="emailError"></small>
          </div>

          <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="Enter 10-digit mobile number"
              inputmode="numeric"
              maxlength="10"
              required
            />
            <small class="error" id="mobileError"></small>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
            <small class="error" id="passwordError"></small>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
            />
            <small class="error" id="confirmPasswordError"></small>
          </div>

          <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course" required>
              <option value="">Select your course</option>
              <option value="CSE">Computer Science Engineering</option>
              <option value="CE">Computer Engineering</option>
              <option value="IT">Information Technology</option>
              <option value="AIML">
                Artificial Intelligence and Machine Learning
              </option>
              <option value="ECE">
                Electronics and Communication Engineering
              </option>
              <option value="ME">Mechanical Engineering</option>
            </select>
            <small class="error" id="courseError"></small>
          </div>

          <div class="form-group">
            <label for="year">Academic Year</label>
            <select id="year" name="year" required>
              <option value="">Select your academic year</option>
              <option value="1">First Year</option>
              <option value="2">Second Year</option>
              <option value="3">Third Year</option>
              <option value="4">Fourth Year</option>
            </select>
            <small class="error" id="yearError"></small>
          </div>

          <fieldset class="form-group gender-group">
            <legend>Gender</legend>
            <label
              ><input type="radio" name="gender" value="Male" /> Male</label
            >
            <label
              ><input type="radio" name="gender" value="Female" /> Female</label
            >
            <label
              ><input type="radio" name="gender" value="Other" /> Other</label
            >
            <small class="error" id="genderError"></small>
          </fieldset>

          <div class="form-group terms-group">
            <label for="terms">
              <input type="checkbox" id="terms" name="terms" />
              I accept the terms and conditions.
            </label>
            <small class="error" id="termsError"></small>
          </div>

          <button type="submit">Register</button>
          <p id="formMessage" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 StudentHub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
